<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Lineups by Knokr{% endblock %}</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/static/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/static/favicon-16x16.png"
    />
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        min-height: 100vh;
        background: linear-gradient(
          180deg,
          #cc1e6c 0%,
          #a51857 25%,
          #5e0e32 50%,
          #370820 75%,
          #21021c 100%
        );
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      a {
        text-decoration: none;
        color: inherit;
      }

      /* Header */
      .site-header {
        width: 100%;
        max-width: 1200px;
        padding: 24px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      /* Search Bar */
      .search-container {
        width: 300px;
      }
      .search-form {
        position: relative;
      }
      .search-input {
        width: 100%;
        padding: 10px 16px 10px 40px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.3);
        color: white;
        transition: all 0.2s;
      }
      .search-input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .search-input:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(0, 0, 0, 0.4);
      }
      .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.5);
        pointer-events: none;
      }

      /* Header Nav */
      .header-nav {
        display: flex;
        gap: 20px;
      }
      .header-nav a {
        color: rgba(255, 255, 255, 0.8);
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s;
      }
      .header-nav a:hover {
        color: #ff6699;
      }

      /* Main Content */
      .main-content {
        width: 100%;
        max-width: 1200px;
        padding: 0 20px 40px;
        flex: 1;
      }

      /* Grid Layouts */
      .grid-4col {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
      @media (min-width: 640px) {
        .grid-4col {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 768px) {
        .grid-4col {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 1024px) {
        .grid-4col {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Card Animation */
      @keyframes cardFadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .grid-4col > *:nth-child(1) { animation-delay: 0s; }
      .grid-4col > *:nth-child(2) { animation-delay: 0.05s; }
      .grid-4col > *:nth-child(3) { animation-delay: 0.1s; }
      .grid-4col > *:nth-child(4) { animation-delay: 0.15s; }
      .grid-4col > *:nth-child(5) { animation-delay: 0.2s; }
      .grid-4col > *:nth-child(6) { animation-delay: 0.25s; }
      .grid-4col > *:nth-child(7) { animation-delay: 0.3s; }
      .grid-4col > *:nth-child(8) { animation-delay: 0.35s; }
      .grid-4col > *:nth-child(9) { animation-delay: 0.4s; }
      .grid-4col > *:nth-child(10) { animation-delay: 0.45s; }
      .grid-4col > *:nth-child(11) { animation-delay: 0.5s; }
      .grid-4col > *:nth-child(12) { animation-delay: 0.55s; }
      .grid-4col > *:nth-child(13) { animation-delay: 0.6s; }
      .grid-4col > *:nth-child(14) { animation-delay: 0.65s; }
      .grid-4col > *:nth-child(15) { animation-delay: 0.7s; }
      .grid-4col > *:nth-child(16) { animation-delay: 0.75s; }
      .grid-4col > *:nth-child(17) { animation-delay: 0.8s; }
      .grid-4col > *:nth-child(18) { animation-delay: 0.85s; }
      .grid-4col > *:nth-child(19) { animation-delay: 0.9s; }
      .grid-4col > *:nth-child(20) { animation-delay: 0.95s; }
      .grid-4col > *:nth-child(21) { animation-delay: 1s; }
      .grid-4col > *:nth-child(22) { animation-delay: 1.05s; }
      .grid-4col > *:nth-child(23) { animation-delay: 1.1s; }
      .grid-4col > *:nth-child(24) { animation-delay: 1.15s; }

      /* Festival Card */
      .festival-card {
        display: block;
        background: #000A14;
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.2s, box-shadow 0.2s;
        animation: cardFadeIn 0.4s ease-out forwards;
        opacity: 0;
      }
      .festival-card:hover {
        transform: scale(1.02);
        box-shadow: 0 0 30px rgba(204, 30, 108, 0.4);
      }
      .festival-socials {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        padding: 4px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 10;
      }
      .festival-card:hover .festival-socials {
        opacity: 1;
      }
      .festival-socials-inner {
        display: flex;
        gap: 4px;
        background: rgba(0, 10, 20, 0.9);
        padding: 4px;
        border-radius: 9999px;
      }
      .festival-card .card-body {
        display: block;
      }
      .festival-card .card-image-wrapper {
        display: block;
        position: relative;
        width: 100%;
        overflow: hidden;
      }
      .festival-card .card-image-wrapper img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        object-position: top;
        transition: transform 0.3s ease;
      }
      .festival-card:hover .card-image-wrapper img {
        transform: scale(1.05);
      }
      .festival-card .card-placeholder {
        width: 100%;
        aspect-ratio: 2 / 3;
        background: linear-gradient(135deg, #5e0e32 0%, #21021c 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.3);
      }

      /* Artist Card (uses golden ratio) */
      .card-image-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 1.618 / 1;
        overflow: hidden;
      }
      .card-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-placeholder {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #5e0e32 0%, #21021c 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.3);
      }
      .card-body {
        padding: 12px;
      }
      .card-body h3 {
        font-size: 14px;
        font-weight: 600;
        color: white;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .festival-name {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: white;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-decoration: none;
      }
      .festival-name:hover {
        text-decoration: underline;
      }
      .card-body p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        margin: 0;
      }
      .card-genre {
        display: inline-block;
        padding: 3px 8px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.9);
        margin-top: 6px;
      }

      /* Artist Card - Orchestra Style */
      .artist-card {
        display: block;
        background: #000A14;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        transition: box-shadow 0.3s;
        animation: cardFadeIn 0.4s ease-out forwards;
        opacity: 0;
      }
      .artist-card:hover {
        box-shadow: 0 0 30px rgba(204, 30, 108, 0.4);
      }
      .artist-card .card-image-wrapper {
        position: relative;
        aspect-ratio: 1.618 / 1;
        overflow: hidden;
      }
      .artist-card .card-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
      }
      .artist-card:hover .card-image-wrapper img {
        transform: scale(1.2);
      }
      .artist-card .card-body {
        padding: 12px 16px;
        text-align: center;
      }
      .artist-card .artist-name {
        font-weight: 700;
        letter-spacing: -0.025em;
        color: white;
        min-height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s;
        text-decoration: none;
      }
      .artist-card .artist-name:hover {
        color: #ff6699;
      }
      .artist-card .artist-name.text-sm { font-size: 14px; }
      .artist-card .artist-name.text-base { font-size: 16px; }
      .artist-card .artist-name.text-xl { font-size: 20px; }
      .artist-card .artist-location {
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        margin: 0;
      }

      /* Artist Placeholder */
      .artist-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(204, 30, 108, 0.4) 0%, rgba(204, 30, 108, 0.2) 100%);
      }
      .artist-placeholder svg {
        width: 33%;
        height: 33%;
        color: rgba(255, 255, 255, 0.5);
      }

      /* Social Icons Overlay */
      .artist-socials {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        padding: 4px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 10;
      }
      .artist-card:hover .artist-socials {
        opacity: 1;
      }
      .artist-socials-inner {
        display: flex;
        gap: 4px;
        background: rgba(0, 10, 20, 0.9);
        padding: 4px;
        border-radius: 9999px;
      }
      .social-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
        text-decoration: none;
      }
      .social-icon:hover {
        transform: scale(1.1);
      }
      .social-icon svg {
        width: 24px;
        height: 24px;
        fill: #FFF5D0;
      }
      .social-icon svg.stroke-icon {
        fill: none;
        stroke: #FFF5D0;
        stroke-width: 2;
      }

      /* Footer */
      .site-footer {
        width: 100%;
        padding: 24px 20px;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }
      .footer-links {
        margin-bottom: 12px;
      }
      .footer-links a {
        color: rgba(255, 255, 255, 0.9);
        margin: 0 12px;
      }
      .footer-links a:hover {
        text-decoration: underline;
      }
      .footer-copyright {
        color: rgba(255, 255, 255, 0.5);
      }
      .footer-copyright a {
        color: rgba(255, 255, 255, 0.7);
      }
      .footer-copyright a:hover {
        text-decoration: underline;
      }

      /* Section Headers */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .section-header h2 {
        font-size: 24px;
        font-weight: 700;
        color: white;
      }
      .section-header a {
        color: white;
        font-size: 16px;
        font-weight: 600;
      }
      .section-header a:hover {
        color: #ff6699;
      }

      /* Page Title */
      .page-title {
        text-align: center;
        margin-bottom: 32px;
      }
      .page-title h1 {
        font-size: 36px;
        font-weight: 800;
        color: white;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      .page-title p {
        color: rgba(255, 255, 255, 0.8);
        font-size: 16px;
        margin-top: 8px;
      }

      /* Responsive header */
      @media (max-width: 768px) {
        .site-header {
          flex-wrap: wrap;
          gap: 16px;
        }
        .search-container {
          order: 2;
          width: 100%;
        }
        .header-nav {
          gap: 12px;
        }
      }

      {% block extra_styles %}{% endblock %}
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="header-nav">
        <a href="/">Home</a>
        <a href="/festivals">Festivals</a>
        <a href="/extractor">Extractor</a>
      </nav>

      <div class="search-container">
        <form action="/search" method="GET" class="search-form">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" name="q" class="search-input" placeholder="Search festivals..." value="{{ request.args.get('q', '') }}" />
        </form>
      </div>
    </header>

    <main class="main-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="footer-links">
        <a href="/terms">Terms of Service</a>
        <a href="/privacy">Privacy & Data</a>
      </div>
      <div class="footer-copyright">
        &copy; {{ current_year }}
        <a href="https://knokr.com" target="_blank" rel="noopener">Knokr</a>.
        All rights reserved.
      </div>
    </footer>

    {% block scripts %}{% endblock %}
  </body>
</html>
